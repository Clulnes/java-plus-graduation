server:
  port: 0

grpc:
  server:
    port: 0

spring:
  datasource:
    url: ${MAIN_DB_URL:jdbc:postgresql://localhost:6541/ewm-main}
    username: ${MAIN_DB_USER:main}
    password: ${MAIN_DB_PASSWORD:main}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analyzer-group
      auto-offset-reset: earliest

topics:
  user-actions: stats.user-actions.v1
  events-similarity: stats.events-similarity.v1